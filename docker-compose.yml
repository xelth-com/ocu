services:
  ocu-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocu-api:latest
    restart: unless-stopped
    ports:
      - "${PORT:-38300}:38300"
    environment:
      # Secrets/config come from a local .env file (never committed).
      OCU_API_KEYS: "${OCU_API_KEYS:?set OCU_API_KEYS in your .env}"
      DRIVER: "${DRIVER:-scraper}"
      PORT: "38300"
      OPAL_URL: "${OPAL_URL:-https://opal-kurier.de}"
      OPAL_USERNAME: "${OPAL_USERNAME:-}"
      OPAL_PASSWORD: "${OPAL_PASSWORD:-}"
      OPAL_USER_DATA_DIR: "/app/.browser-data"
    volumes:
      # Persist the browser profile (cookies/session) across restarts.
      - ocu-browser-data:/app/.browser-data
    # Chromium needs a bit of shared memory for stability.
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:38300/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  ocu-browser-data:
